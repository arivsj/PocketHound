# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Se o build reclamar que não encontra o aapt2, descomente e aponte para o
# build-tools da SUA máquina. O caminho absoluto não pode ficar versionado: ele
# quebra em qualquer outro computador e quando o SDK é atualizado.
# android.aapt2FromMavenOverride=/caminho/para/Android/Sdk/build-tools/36.0.0/aapt2
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.runViaBuildToolsApi=false
